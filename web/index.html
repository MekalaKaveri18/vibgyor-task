<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibgyor · 3D viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27%3E%3Ccircle cx=%272%27 cy=%275%27 r=%271.6%27 fill=%27%23b8562e%27/%3E%3Ccircle cx=%275%27 cy=%275%27 r=%271.6%27 fill=%27%23c99a52%27/%3E%3Ccircle cx=%278%27 cy=%275%27 r=%271.6%27 fill=%27%23829c8a%27/%3E%3C/svg%3E">
<style>html,body{background:#1d2623;margin:0}</style>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<header>
  <div class="brand"><span class="dots"><i></i><i></i><i></i></span> Vibgyor</div>
  <div class="sub">Prahlad Nagar, Ahmedabad · stilt + 7 floors · 2 × 4BHK per floor</div>
</header>

<aside id="panel">
  <h2 id="floor-title">Click a floor</h2>
  <p id="floor-sub" class="muted">Orbit with the left mouse button, pan with the right, zoom with the wheel.</p>
  <div id="flats"></div>
  <div id="floor-list"></div>
  <div class="row">
    <button id="btn-time">Evening</button>
    <button id="btn-isolate">Isolate floor</button>
    <button id="btn-reset">Reset view</button>
  </div>
  <div class="legend"><span class="chip a"></span> Type A · front, on the 18 m road
    <span class="chip b"></span> Type B · rear</div>
</aside>

<div id="fps" title="frames per second">– fps</div>
<div id="loading"><div id="bar"><div id="fill"></div></div><div id="loadtext">Loading model…</div></div>
<script type="module" src="main.js"></script>
</body>
</html>
